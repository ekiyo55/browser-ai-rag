[project]
name = "browser-ai-rag"
version = "0.1.0"
description = "『ブラウザのAIが社内で働きだす ― MCPで作る文書検索・メール・勤怠』のサンプル"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    "uvicorn>=0.30",
    "kotobacore>=1.1",      # 日本語の切り分け（第12章）
    "fastembed>=0.8",       # 埋め込みモデルを ONNX で動かす（第13章）
    "numpy>=2",
    "pypdfium2>=4",         # PDF
    "python-docx>=1.1",     # Word
    "openpyxl>=3.1",        # Excel
]

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browser_ai_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
