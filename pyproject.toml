[project]
name = "browser-ai-rag"
version = "0.1.0"
description = "『ブラウザのAIに社内文書を読ませる ― MCPで作るRAGサーバー入門』のサンプル"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browser_ai_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
